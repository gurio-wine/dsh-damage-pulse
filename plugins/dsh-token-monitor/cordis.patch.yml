# dsh-token-monitor 挂载层：把插件插入到 dsh 的组合树。
#
# 集成方法：把本仓库的 plugins/dsh-token-monitor 放到你的 DSH 仓库 plugins/ 目录下，
# 然后把下面的 name 替换成你的 DSH 仓库的绝对路径。
# 注意：Windows 下 loader 用 Node ESM 解析插件入口，绝对路径必须是 file:// URL
# （`E:\...` 会被当成 `e:` 协议而报 ERR_UNSUPPORTED_ESM_URL_SCHEME）。
#
# 示例（把 PATH/TO/YOUR 替换为真实路径）：
#   name: 'file:///C:/dev/deepseek-harness/plugins/dsh-token-monitor/src/index.ts'
- insert:
    - id: dsh-token-monitor
      name: 'file:///PATH/TO/YOUR/deepseek-harness/plugins/dsh-token-monitor/src/index.ts'
